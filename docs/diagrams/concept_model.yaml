# Концептуальная модель БД (ЛР 2) — в оформлении методички (рис. 1 и 2 ЛР 2):
# таблица = заголовок + строки-поля на русском, ключевые поля «Код …», связи «1 — ∞».
#   python tools/drawio/concept2drawio.py docs/diagrams/concept_model.yaml
# Результат: docs/diagrams/concept_model.drawio (контрастный ЧБ стиль, помещается на лист А4).
#
# rows: [ключ, поле] — ключ ПК (первичный, жирным над линией), ВК (внешний) или пусто.
#   Несколько полей ПК — один составной первичный ключ (у сеанса: секционирование по дате, ЛР 8).
# pos — левый верхний угол таблицы; width — ширина.
# Абонент — общий реестр (D25): провайдер и абонент связаны «многие ко многим» через договор
#   (линии «Провайдер — Договор» и «Абонент — Договор»).
# relations: parent/prow — таблица и поле родителя (по умолчанию первое поле ПК),
#   child/crow — таблица и поле потомка; via — x вертикального участка линии;
#   card — подписи концов [у родителя, у потомка]; dashed — логическая связь без FK
#   (на системную таблицу внешний ключ не ставится).
# legend — необязательный блок пояснений под схемой (сейчас не выводится по просьбе студента).
# show_kind — подпись вида таблицы (справочник, базовая таблица…) под названием; выключена по просьбе студента,
#   kind остаётся в описании для справки.
# Системные таблицы PostgreSQL (pg_authid — пользователи и группы, pg_auth_members — членство в группах)
#   на схеме не показаны (решение студента, 2026-10-07); они описаны в labs/lab02/model.md, раздел 3.1.
#   Если вернуть их на схему: system: true — таблица pg_catalog, в базе не создаётся; связь с сотрудником — dashed.
#   Своих таблиц пользователей/паролей в проекте нет.

show_kind: false

tables:
  # ---- колонка 1 ----
  - id: ownership_type
    title: Тип собственности
    kind: справочник
    pos: [0, 0]
    width: 240
    rows:
      - [ПК, Код типа собственности]
      - ["", Тип собственности]

  - id: city
    title: Город
    kind: справочник
    pos: [0, 122]
    width: 240
    rows:
      - [ПК, Код города]
      - ["", Город]

  - id: subscriber_type
    title: Тип абонента
    kind: справочник
    pos: [0, 244]
    width: 240
    rows:
      - [ПК, Код типа абонента]
      - ["", Тип абонента]
      - ["", Юридическое лицо]

  - id: change_log
    title: Журнал изменений
    kind: служебная таблица
    pos: [0, 400]
    width: 240
    rows:
      - [ПК, Код записи]
      - ["", Дата и время изменения]
      - ["", Пользователь БД]
      - ["", Таблица]
      - ["", Операция]
      - ["", Ключ строки]
      - ["", Строка до изменения]
      - ["", Строка после изменения]


  # ---- колонка 2 ----
  - id: provider
    title: Провайдер
    kind: базовая таблица
    pos: [320, 0]
    width: 240
    rows:
      - [ПК, Код провайдера]
      - ["", Название]
      - [ВК, Код типа собственности]
      - [ВК, Код города]
      - ["", Адрес]
      - ["", Телефон]
      - ["", Год начала работы]

  - id: subscriber
    title: Абонент
    kind: базовая таблица
    pos: [320, 222]
    width: 240
    rows:
      - [ПК, Код абонента]
      - ["", ФИО или название предприятия]
      - [ВК, Код города]
      - [ВК, Код типа абонента]
      - ["", Физический адрес]
      - ["", Телефон]
      - ["", Версия строки]

  - id: tariff
    title: Тариф
    kind: справочник
    pos: [320, 444]
    width: 240
    rows:
      - [ПК, Код тарифа]
      - ["", Обозначение]
      - ["", Тариф]
      - ["", "Скидка, %"]
      - ["", Начало действия]
      - ["", Окончание действия]
      - ["", Выходные дни]
      - ["", Описание]

  # ---- колонка 3 ----
  - id: contract
    title: Договор
    kind: таблица пересечения
    pos: [640, 0]
    width: 240
    rows:
      - [ПК, Код договора]
      - [ВК, Код провайдера]
      - ["", Номер договора]
      - [ВК, Код абонента]
      - ["", Дата подключения]
      - ["", Стоимость подключения]
      - ["", Стоимость 1 Мб]
      - ["", IP-адрес]
      - ["", Адрес подключения]
      - ["", Контактный телефон]
      - ["", Контактное лицо]
      - ["", Дата расторжения]
      - ["", Комментарий]
      - ["", Версия строки]

  - id: session
    title: Сеанс связи
    kind: базовая таблица
    pos: [640, 342]
    width: 240
    rows:
      - [ПК, Код сеанса]
      - [ПК, Дата и время сеанса]
      - [ВК, Код договора]
      - [ВК, Код тарифа]
      - ["", Количество Мб]
      - ["", "Скидка, %"]
      - ["", Стоимость сеанса]

  - id: app_user
    title: Сотрудник
    kind: служебная таблица
    pos: [640, 540]
    width: 240
    rows:
      - [ПК, Код сотрудника]
      - [ВК, Код провайдера]
      - ["", Логин]
      - ["", ФИО]
      - ["", Дата регистрации]
      - ["", Выдан временный пароль]
      - ["", Когда выдан временный пароль]
      - ["", Кто выдал временный пароль]

relations:
  - {id: R1, parent: ownership_type, child: provider, crow: Код типа собственности, via: 262}
  - {id: R2, parent: city, child: provider, crow: Код города, via: 292}
  - {id: R3, parent: city, child: subscriber, crow: Код города, via: 292}
  - {id: R4, parent: subscriber_type, child: subscriber, crow: Код типа абонента, via: 262}
  - {id: R5, parent: provider, child: contract, crow: Код провайдера, via: 590}
  - {id: R6, parent: subscriber, child: contract, crow: Код абонента, via: 602}
  - {id: R7, parent: contract, child: session, crow: Код договора, via: 905}
  - {id: R8, parent: tariff, child: session, crow: Код тарифа, via: 592}
  - {id: R9, parent: provider, child: app_user, crow: Код провайдера, via: 577}
